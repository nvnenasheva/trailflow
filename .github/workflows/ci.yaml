name: ci
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - name: Install deps
      run: |
        python -m pip install -U pip
        pip install -r requirements.txt pre-commit ruff mypy pytest
        pre-commit install-hooks
    - name: Lint & typecheck
      run: |
        ruff check .
        mypy src
    - name: Tests
      run: pytest -q